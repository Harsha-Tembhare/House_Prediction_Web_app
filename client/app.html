<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bangalore Home Price Prediction</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="form-card">
            <h1>Predict Your Home's Value</h1>

            <label for="uiSqft">Area (Square Feet)</label>
            <input class="area" type="number" id="uiSqft" value="1000">

            <label>BHK</label>
            <div class="switch-field">
                <input type="radio" id="radio-one" name="uiBHK" value="1">
                <label for="radio-one">1 BHK</label>

                <input type="radio" id="radio-two" name="uiBHK" value="2" checked>
                <label for="radio-two">2 BHK</label>

                <input type="radio" id="radio-three" name="uiBHK" value="3">
                <label for="radio-three">3 BHK</label>

                <input type="radio" id="radio-four" name="uiBHK" value="4">
                <label for="radio-four">4 BHK</label>

                <input type="radio" id="radio-five" name="uiBHK" value="5">
                <label for="radio-five">5 BHK</label>
            </div>

            <label>Bath</label>
            <div class="switch-field">
                <input type="radio" id="radio-bath-1" name="uiBath" value="1">
                <label for="radio-bath-1">1</label>

                <input type="radio" id="radio-bath-2" name="uiBath" value="2" checked>
                <label for="radio-bath-2">2</label>

                <input type="radio" id="radio-bath-3" name="uiBath" value="3">
                <label for="radio-bath-3">3</label>

                <input type="radio" id="radio-bath-4" name="uiBath" value="4">
                <label for="radio-bath-4">4</label>

                <input type="radio" id="radio-bath-5" name="uiBath" value="5">
                <label for="radio-bath-5">5</label>
            </div>

            <label for="uiLocations">Location</label>
            <select id="uiLocations" class="locations">
                <option value="" disabled selected>Choose a Location</option>
                <option value="Electronic City">Electronic City</option>
                <option value="Rajaji Nagar">Rajaji Nagar</option>
            </select>

            <button class="btn" onclick="onClickedEstimatedPrice()" type="button">ESTIMATE PRICE</button>
            <div id="uiEstimatedPrice" class="result"><h2></h2></div>
        </div>

        
    </div>
</body>
</html>
